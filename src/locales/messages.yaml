project.createNoticeItem2:
  zhCn: 任何类型的煽动暴力、宣扬恐怖主义的内容。
  en: Any type of content inciting violence or promoting terrorism.
project.createNoticeItem3:
  zhCn: 任何类型的含有恐怖、血腥场景的内容。
  en: Any type of content containing horror or bloody scenes.
project.createNoticeItem4:
  zhCn: 任何类型的侵犯他人合法权益的内容。
