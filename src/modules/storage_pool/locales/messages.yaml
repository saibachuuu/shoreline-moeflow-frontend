storagePool.secretKey:
  zhCn: Secret Access Key
  en: Secret Access Key
storagePool.credentialKeepTip:
  zhCn: 留空表示不修改现有凭据
  en: Leave blank to keep the current credential
storagePool.publicDomain:
  zhCn: 公开访问域名（可选）
  en: Public Domain (optional)
storagePool.publicDomainTip:
  zhCn: 填了就走这个域名直链；留空则生成 S3 预签名 URL
  en: When set, files are served from this domain; otherwise signed S3 URLs are used
storagePool.inactiveDays:
  zhCn: 冷数据天数
  en: Inactive Days
storagePool.inactiveDaysTip:
  zhCn: 超过这么多天没有改动过的项目才允许自动迁入
  en: Only projects untouched for this many days are migrated automatically
storagePool.maxObjectsPerRun:
