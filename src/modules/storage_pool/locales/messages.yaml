storagePool.autoScan:
  zhCn: 自动巡查
  en: Automatic Scan
storagePool.scanEnabled:
  zhCn: 每日自动挑选冷项目
  en: Pick cold projects daily
storagePool.scanEnabledTip:
  zhCn: 关闭后不再自动挑选新项目；进行中的迁移不受影响。
  en: When off, no new projects are picked automatically. Transfers already running are unaffected.
