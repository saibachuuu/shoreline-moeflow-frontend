storagePool.name:
  zhCn: 名称
  en: Name
storagePool.bucket:
  zhCn: 存储桶
  en: Bucket
storagePool.subPath:
  zhCn: 子路径
  en: Sub Path
storagePool.subPathTip:
  zhCn: 这就是该来源的对象总前缀，默认 storage/ 与站点默认存储一致（迁移时对象路径不变，只换桶）
  en: This is the source's object key prefix. Keeping the default storage/ makes migrations a pure bucket swap.
storagePool.subPathInvalid:
  zhCn: 只能包含字母、数字、点、下划线、连字符与斜杠
  en: Only letters, digits, dot, underscore, hyphen and slash are allowed
storagePool.subPathLockedReason:
  zhCn: 该来源已有项目迁入。修改子路径会让这些项目的文件全部读不到——请先把项目回迁到默认存储，再修改。
  en: Projects have already been migrated here. Changing the sub path would make their files unreachable — restore those projects first.
storagePool.locked:
  zhCn: 已锁定
  en: locked
storagePool.region:
  zhCn: 区域
  en: Region
storagePool.regionTip:
  zhCn: 必须和服务端配置一字不差，错了连通性测试会报 400（比如这家要填 usagis，填 auto 就不通）
  en: Must match the server exactly, or the connection test fails with 400 (e.g. this provider needs usagis, auto does not work)
storagePool.addressingStyle:
  zhCn: 寻址方式
  en: Addressing
storagePool.verifySsl:
  zhCn: 校验 TLS 证书
  en: Verify TLS
storagePool.accessKey:
  zhCn: Access Key ID
