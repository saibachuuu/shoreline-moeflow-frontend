storagePool.usageNote:
  zhCn: 以上均按项目记账求和，不含桶里没有项目指向的孤儿对象；与桶账单的差额需自行核对。
  en: These numbers come from per-project accounting and exclude orphan objects no project points to. Reconcile any difference against the bucket bill.
