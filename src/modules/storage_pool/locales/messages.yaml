storagePool.disableConfirm:
  zhCn: 确定停用该来源？
  en: Disable this source?
storagePool.disableConfirmContent:
  zhCn: 已有项目迁入该来源。停用后这些项目会退化为读默认存储，文件将打不开——除非你马上把它们回迁。确定要停吗？
  en: Projects have already been migrated here. After disabling, they fall back to default storage and their files become unreadable — unless you restore them right away. Disable anyway?
