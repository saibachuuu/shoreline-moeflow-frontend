  en: Last scan
storagePool.neverScanned:
  zhCn: 尚未执行过巡查
  en: Never scanned yet
storagePool.scanNow:
  zhCn: 立即巡查一次
  en: Scan Now
storagePool.scanNowConfirm:
  zhCn: 会真的开始挑选并搬运文件，确定现在执行？
  en: This will really pick and move files. Run it now?
storagePool.scanQueued:
  zhCn: 巡查任务已排队
  en: Scan queued
storagePool.scanFailed:
  zhCn: 触发巡查失败
  en: Failed to trigger scan
storagePool.emergencyStop:
  zhCn: 紧急停止
  en: Emergency Stop
storagePool.emergencyStopTip:
  zhCn: 打开后已排队的迁移会停在待执行，恢复后从断点续搬。
  en: Queued transfers stop at pending and resume from where they left off when switched back.
