<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/static/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"/>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="MoeFlow" />
    <link rel="apple-touch-icon" href="/static/logo192.png" />
    <link rel="manifest" href="/static/manifest.json" />
    <title>MoeFlow</title>
    <style>
      :root {
        --image-darkness: 0;
      }

      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background-color: #fff;
      }

      [data-theme='dark'],
      [data-theme='dark'] body,
      [data-theme='dark'] #root {
        background-color: #1b1b20;
        color: rgba(255, 255, 255, 0.85);
        color-scheme: dark;
      }
    </style>
    <script>
      (function () {
        var theme = localStorage.getItem('themeMode');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#1b1b20' : '#fff';
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx" ></script>
  </body>
</html>
